<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1f2937;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        #displayWrapper {
        position: relative;
        max-width: 900px;
        margin: 20px auto;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #display {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 200px;
            white-space: pre-wrap;
            text-align: left;
            font-family: Consolas, monospace;
        }

        #copyBtn {
            position: absolute;
            bottom: 10px;
            left: 10px;
        
            padding: 6px 12px;
            font-size: 12px;
        
            background: #10b981;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        
        #copyBtn:hover {
            background: #059669;
        }

        #toast {
    visibility: hidden;
    opacity: 0;

    position: fixed;
    bottom: 20px;
    right: 20px;

    background-color: #10b981;
    color: white;

    padding: 12px 20px;
    border-radius: 8px;

    font-family: Arial, sans-serif;
    font-size: 14px;

    transition: opacity 0.3s ease;
    z-index: 9999;
}

#toast.show {
    visibility: visible;
    opacity: 1;
}
    </style>
</head>
<body>
<div class="container">
    <h1>Deployment Portal</h1>
    
    <div class="button-grid">
    
    <button onclick="showSuperRemover()"> Super Remover </button>

    <button onclick="showSuperRemoverGUI()"> Super Remover HUI </button>

    <button onclick="showText('https://portal.office.com')"> Office 365 Portal </button>

    <button onclick="showText('winget install Zoom.Zoom')"> Install Zoom </button>

    <button onclick="showText(`
    Checklist:
    1. Verify user logged out
    2. Rename workstation
    3. Install printer
    4. Test Outlook`)">
        New PC Checklist
    </button>

    
    </div>
</div>
<div id="displayWrapper">
<div id="display"> 
    Click a button to display information. 
</div>
    <button id="copyBtn" onclick="copyText()"> Copy Displayed Text </button>
</div>

<script>
   
function showSuperRemover() {
    showText('iex (irm "https://raw.githubusercontent.com/MrWes3000/WDA/main/SuperRemover.ps1")');
}

function showSuperRemoverGUI() {
    showText('iex (irm "https://raw.githubusercontent.com/MrWes3000/WDA/main/SuperRemoverGUI.ps1")');
}
   
let currentText = "";

function showText(text) {
    currentText = text;
    document.getElementById("display").textContent = text;
}

function copyText() {
    if (!currentText) return;

    navigator.clipboard.writeText(currentText);

    showToast("Copied to clipboard!");
}

    function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1500);
}

</script>

</body>
</html>
