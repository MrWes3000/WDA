<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1f2937;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #display {
            margin-top: 30px;
            padding: 15px;
            background: #374151;
            border-radius: 8px;
            white-space: pre-wrap;
            text-align: left;
        }

        #display ul,
        #display ol {
        margin-left: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Deployment Portal</h1>
    
    <div class="button-grid">
    
    <button onclick="showSuperRemover()"> Super Remover </button>

    <button onclick="showText('https://portal.office.com')"> Office 365 Portal </button>

    <button onclick="showText('winget install Zoom.Zoom')"> Install Zoom </button>

    <button onclick="showText(`Checklist:
    
    1. Verify user logged out
    2. Rename workstation
    3. Install printer
    4. Test Outlook`)">
        New PC Checklist
    </button>

    <button onclick="copyText()"> Copy Displayed Text </button>
    </div>
</div>
<div id="display"> 
        Click a button to display information. 
</div>


<script>
   
function showSuperRemover() {
    showText('iex (irm "https://raw.githubusercontent.com/MrWes3000/WDA/main/SuperRemover.ps1")');
}

   
let currentText = "";

function showText(text) {
    currentText = text;
    document.getElementById("display").textContent = text;
}

function copyText() {
    if (!currentText) return;

    navigator.clipboard.writeText(currentText);

    alert("Copied to clipboard");
}
</script>

</body>
</html>
