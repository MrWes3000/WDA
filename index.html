<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Runbook</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1f2937;
        color: white;
        margin: 0;
        padding: 30px;
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        max-width: 900px;
        margin: auto;
    }

    button {
        padding: 14px;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }

    button:hover {
        background: #1d4ed8;
    }

    #output {
        margin-top: 25px;
        background: #111827;
        padding: 20px;
        border-radius: 10px;
        text-align: left;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
    }

    #copyBtn {
        margin-top: 10px;
        background: #10b981;
    }
</style>
</head>

<body>

<h1>Deployment Runbook</h1>

<div class="grid">

    <button onclick="setCmd('winget install Zoom.Zoom')">Install Zoom</button>

    <button onclick="setCmd('winget install 7zip.7zip')">Install 7-Zip</button>

    <button onclick="setCmd('winget install Adobe.Acrobat.Reader.64-bit')">Install Adobe Reader</button>

    <button onclick="setCmd('gpupdate /force')">Run GPUpdate</button>

    <button onclick="setCmd('shutdown /r /t 0')">Restart PC</button>

    <button onclick="setCmd('Remove-Office')">Remove Office (Runbook)</button>

    <button onclick="SetCmd('iex (irm &quot;https://raw.githubusercontent.com/MrWes3000/WDA/refs/heads/main/SuperRemoverGUI.ps1&quot;)')"> Master GUI </button> 

</div>

<div id="output">
Click a button to generate a PowerShell command
</div>

<button id="copyBtn" onclick="copyCmd()">Copy Command</button>

<script>
let currentCmd = "";

function setCmd(cmd) {
    currentCmd = cmd;

    document.getElementById("output").innerText =
`PowerShell Command:
-------------------------
${cmd}`;
}

function copyCmd() {
    if (!currentCmd) return;

    navigator.clipboard.writeText(currentCmd);

    document.getElementById("copyBtn").innerText = "Copied!";

    setTimeout(() => {
        document.getElementById("copyBtn").innerText = "Copy Command";
    }, 1500);
}
</script>

</body>
</html>
