<!DOCTYPE html>
<html>
<head>
<title>Deployment Runbook</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #1f2937;
    color: white;
    padding: 20px;
}

button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
}

#display {
    margin-top: 20px;
    padding: 15px;
    background: #111827;
    border-radius: 8px;
    white-space: pre-wrap;
    min-height: 200px;
    font-family: Consolas, monospace;
}
</style>
</head>
<body>

<h1>Deployment Portal</h1>

<button onclick="showSuperRemover()">
    Super Remover
</button>

<button onclick="showText('https://portal.office.com')">
    Office 365 Portal
</button>

<button onclick="showText('winget install Zoom.Zoom')">
    Install Zoom
</button>

<button onclick="showText(`Checklist:

1. Verify user logged out
2. Rename workstation
3. Install printer
4. Test Outlook`)">
    New PC Checklist
</button>

<button onclick="copyText()">
    Copy Displayed Text
</button>

<div id="display">
Click a button to display information.
</div>

<script>
   
function showSuperRemover() {
    showText('iex (irm "https://raw.githubusercontent.com/MrWes3000/WDA/main/SuperRemover.ps1")');
}

   
let currentText = "";

function showText(text) {
    currentText = text;
    document.getElementById("display").textContent = text;
}

function copyText() {
    if (!currentText) return;

    navigator.clipboard.writeText(currentText);

    alert("Copied to clipboard");
}
</script>

</body>
</html>
